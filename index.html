<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AdsDekho PaiseKamao</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --bg-gradient: linear-gradient(135deg, #09070f 0%, #130f26 100%); --card-bg: rgba(255, 255, 255, 0.05); --card-border: rgba(255, 255, 255, 0.09); --accent-green: #00ff66; --text-main: #ffffff; --text-muted: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }
        header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); position: sticky; top: 0; background: rgba(19, 15, 38, 0.85); z-index: 1000; }
        .logo { font-size: 20px; font-weight: 900; background: linear-gradient(45deg, #00ff66, #00e5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .wallet-box { background: rgba(0, 255, 102, 0.12); color: var(--accent-green); padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 14px; }
        .app-container { padding: 20px; max-width: 480px; margin: 0 auto; }
        .section { display: none; } .section.active { display: block; }
        .premium-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 22px; padding: 20px; margin-bottom: 20px; text-align: center; }
        .app-btn { background: linear-gradient(135deg, #9d4edd 0%, #6a0dad 100%); color: white; border: none; padding: 14px 20px; width: 100%; border-radius: 14px; cursor: pointer; margin-top: 15px; font-weight: 600; }
        /* Spin Wheel */
        #wheel { width: 150px; height: 150px; border-radius: 50%; border: 8px solid #333; margin: 15px auto; display: flex; align-items: center; justify-content: center; transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); background: conic-gradient(#ff0000 0deg 72deg, #00ff00 72deg 144deg, #ffff00 144deg 216deg, #0000ff 216deg 288deg, #ff00ff 288deg 360deg); color: #000; font-weight: bold; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(9, 7, 15, 0.92); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--card-border); z-index: 1000; }
        .nav-item { color: var(--text-muted); cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--accent-green); }
    </style>
</head>
<body>

    <header>
        <div class="logo">AdsDekho PaiseKamao</div>
        <div class="wallet-box">🪙 ₹<span id="balance">0.00</span></div>
    </header>

    <div class="app-container">
        <div id="home" class="section active">
            <button class="app-btn" onclick="claimTelegramBonus()" style="background: linear-gradient(135deg, #0088cc 0%, #006699 100%);">Join channel nd claim 4 ₹</button>
            
            <div class="premium-card">
                <h3>Lucky Spin Wheel 🎡</h3>
                <div id="wheel">SPIN</div>
                <button class="app-btn" onclick="spinWheel()">SPIN NOW</button>
            </div>
            
            <div class="premium-card"><h3>GK Quiz 🧠 <span style="font-size:10px; color:#aaa;">Coming Soon</span></h3></div>
            <div class="premium-card"><h3>Math Quiz ➗ <span style="font-size:10px; color:#aaa;">Coming Soon</span></h3></div>
        </div>

        <div id="view-ads" class="section">
            <div class="premium-card">
                <h2>Watch Premium Ads</h2>
                <button class="app-btn" style="background:var(--accent-green); color:#000;" onclick="openInAppAdEngine()">Watch Video Ad (+ ₹0.50)</button>
            </div>
        </div>

        <div id="redeem" class="section">
            <div class="premium-card">
                <h2>Redeem Gift Card</h2>
                <form id="payout-form" onsubmit="handleFirebaseRedeem(event)">
                    <input type="email" id="user-email" placeholder="Email ID" required style="width:100%; padding:10px; background:#111; border:1px solid #333; border-radius:8px; color:white; margin-bottom:10px;">
                    <button type="submit" class="app-btn">Confirm Redemption</button>
                </form>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchToTab('home', this)">🏠<br>Home</div>
        <div class="nav-item" onclick="switchToTab('view-ads', this)">📺<br>Ads</div>
        <div class="nav-item" onclick="switchToTab('redeem', this)">🎁<br>Redeem</div>
    </nav>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA7CCx2yrZK3HfGTlawBI8RiP70bMm55Z4", authDomain: "adsdekho-pese-kamao.firebaseapp.com", projectId: "adsdekho-pese-kamao", storageBucket: "adsdekho-pese-kamao.firebasestorage.app", messagingSenderId: "1041347482830", appId: "1:1041347482830:web:4cb835e22749aaeeb46c9f" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let walletBalance = parseFloat(localStorage.getItem('adsdekho_pk_bal')) || 0.00;
        document.getElementById('balance').innerText = walletBalance.toFixed(2);

        function switchToTab(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        function spinWheel() {
            const wheel = document.getElementById('wheel');
            const prizes = [1, 2, 0.50, 8, -5];
            const randomDegree = Math.floor(Math.random() * 360) + 1440;
            wheel.style.transform = `rotate(${randomDegree}deg)`;
            setTimeout(() => {
                const prize = prizes[Math.floor(Math.random() * prizes.length)];
                walletBalance += prize;
                localStorage.setItem('adsdekho_pk_bal', walletBalance);
                document.getElementById('balance').innerText = walletBalance.toFixed(2);
                alert("Spin Result: ₹" + prize);
            }, 4000);
        }

        function claimTelegramBonus() {
            if(localStorage.getItem('telegram_bonus_claimed')) { alert("Already claimed!"); return; }
            walletBalance += 4.00;
            localStorage.setItem('adsdekho_pk_bal', walletBalance);
            localStorage.setItem('telegram_bonus_claimed', 'true');
            document.getElementById('balance').innerText = walletBalance.toFixed(2);
            window.open("https://t.me/adsdekho", "_blank");
        }
    </script>
</body>
</html>
