<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AdsDekho PaiseKamao</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --bg-gradient: #09070f; --card-bg: rgba(255, 255, 255, 0.05); --card-border: rgba(255, 255, 255, 0.15); --accent-green: #00ff66; --text-main: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }
        header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); position: sticky; top: 0; background: #09070f; z-index: 1000; }
        .logo { font-size: 18px; font-weight: 900; color: var(--accent-green); }
        .wallet-box { background: rgba(0, 255, 102, 0.1); color: var(--accent-green); padding: 5px 12px; border-radius: 20px; font-weight: bold; }
        .app-container { padding: 15px; max-width: 480px; margin: 0 auto; }
        .section { display: none; } .section.active { display: block; }
        .premium-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .coming-soon-card { opacity: 0.7; border-left: 5px solid #555; }
        .premium-badge { font-size: 10px; background: #333; padding: 2px 8px; border-radius: 10px; color: #aaa; }
        .app-btn { background: #0088cc; color: white; border: none; padding: 12px; width: 100%; border-radius: 12px; font-weight: bold; margin-bottom: 15px; cursor: pointer; }
        .giftcard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .giftcard-option { background: #1a1a1a; padding: 10px; text-align: center; border-radius: 10px; border: 1px solid #333; cursor: pointer; font-size: 11px; }
        .giftcard-option.active { border-color: var(--accent-green); background: #112211; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #111; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #333; }
        .nav-item { cursor: pointer; text-align: center; font-size: 12px; color: #888; }
        .nav-item.active { color: var(--accent-green); }
        #inapp-ad-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo">AdsDekho PaiseKamao</div>
        <div class="wallet-box">🪙 ₹<span id="balance">0.00</span></div>
    </header>

    <div class="app-container">
        <div id="home" class="section active">
            <button class="app-btn" onclick="claimTelegramBonus()">Join channel nd claim 4 ₹</button>
            <div class="premium-card"><h2>Welcome Back! 👋</h2></div>
            <div class="premium-card coming-soon-card"><h3>Lucky Spin Wheel 🎡 <span class="premium-badge">Coming Soon</span></h3></div>
            <div class="premium-card coming-soon-card"><h3>GK Quiz 🧠 <span class="premium-badge">Coming Soon</span></h3></div>
            <div class="premium-card coming-soon-card"><h3>Math Quiz ➗ <span class="premium-badge">Coming Soon</span></h3></div>
        </div>

        <div id="view-ads" class="section">
            <div class="premium-card">
                <h2>Watch Premium Ads</h2>
                <button class="app-btn" style="background:var(--accent-green); color:#000;" onclick="openInAppAdEngine()">Watch Video Ad (+ ₹0.50)</button>
            </div>
        </div>

        <div id="redeem" class="section">
            <div class="premium-card">
                <h2>Redeem Gift Card</h2>
                <div class="giftcard-grid">
                    <div class="giftcard-option" onclick="selectGift(this, 'Amazon')">Amazon</div>
                    <div class="giftcard-option" onclick="selectGift(this, 'PlayStore')">PlayStore</div>
                    <div class="giftcard-option" onclick="selectGift(this, 'Flipkart')">Flipkart</div>
                </div>
                <form id="payout-form" onsubmit="handleFirebaseRedeem(event)">
                    <input type="email" id="user-email" placeholder="Email ID" required style="width:100%; padding:10px; background:#111; border:1px solid #333; border-radius:8px; color:white; margin-bottom:10px;">
                    <input type="number" id="payout-amount" placeholder="Amount (Min 10)" min="10" required style="width:100%; padding:10px; background:#111; border:1px solid #333; border-radius:8px; color:white;">
                    <button type="submit" class="app-btn" style="background:#444; margin-top:15px;">Confirm Redemption</button>
                </form>
            </div>
        </div>
    </div>

    <div id="inapp-ad-modal">
        <iframe id="ad-target-frame" style="width:100%; height:80%; border:none;"></iframe>
        <button id="close-ad" style="display:none; padding:10px 20px; margin-top:20px; background:red; color:white; border:none; border-radius:5px;" onclick="closeInAppAdEngine()">Close Ad</button>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchToTab('home', this)">🏠<br>Home</div>
        <div class="nav-item" onclick="switchToTab('view-ads', this)">📺<br>Ads</div>
        <div class="nav-item" onclick="switchToTab('redeem', this)">🎁<br>Redeem</div>
    </nav>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA7CCx2yrZK3HfGTlawBI8RiP70bMm55Z4", authDomain: "adsdekho-pese-kamao.firebaseapp.com", projectId: "adsdekho-pese-kamao", storageBucket: "adsdekho-pese-kamao.firebasestorage.app", messagingSenderId: "1041347482830", appId: "1:1041347482830:web:4cb835e22749aaeeb46c9f" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let selectedGift = "";
        let walletBalance = parseFloat(localStorage.getItem('adsdekho_pk_bal')) || 0.00;
        document.getElementById('balance').innerText = walletBalance.toFixed(2);

        function selectGift(el, type) {
            document.querySelectorAll('.giftcard-option').forEach(o => o.classList.remove('active'));
            el.classList.add('active');
            selectedGift = type;
        }

        function switchToTab(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        function claimTelegramBonus() {
            window.open("https://t.me/adsdekho", "_blank");
            if(localStorage.getItem('telegram_bonus_claimed')) { alert("Aap pehle hi bonus le chuke hain!"); return; }
            walletBalance += 4.00;
            localStorage.setItem('adsdekho_pk_bal', walletBalance);
            localStorage.setItem('telegram_bonus_claimed', 'true');
            document.getElementById('balance').innerText = walletBalance.toFixed(2);
            alert("✨ Mubarak ho! ₹4.00 add ho gaye.");
        }

        function openInAppAdEngine() {
            document.getElementById('inapp-ad-modal').style.display = 'flex';
            document.getElementById('ad-target-frame').src = "https://www.effectivecpmnetwork.com/m2ds8022zn?key=b7ed26fc3794ac80821ca064a92d5e76";
            setTimeout(() => { document.getElementById('close-ad').style.display = 'block'; }, 30000);
        }

        function closeInAppAdEngine() {
            document.getElementById('inapp-ad-modal').style.display = 'none';
            walletBalance += 0.50;
            localStorage.setItem('adsdekho_pk_bal', walletBalance);
            document.getElementById('balance').innerText = walletBalance.toFixed(2);
            alert("Mubarak ho! ₹0.50 add ho gaye.");
        }

        function handleFirebaseRedeem(event) {
            event.preventDefault();
            if (!selectedGift) { alert("Please select a gift card!"); return; }
            db.collection("redemption_requests").add({ email: document.getElementById('user-email').value, amount: document.getElementById('payout-amount').value, gift: selectedGift }).then(() => {
                alert("Request sent!");
            });
        }
    </script>
</body>
</html>
