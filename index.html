<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AdsDekho PaiseKamao</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --bg-gradient: linear-gradient(135deg, #09070f 0%, #130f26 100%); --card-bg: rgba(255, 255, 255, 0.05); --card-border: rgba(255, 255, 255, 0.09); --accent-green: #00ff66; --text-main: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }
        header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); position: sticky; top: 0; background: rgba(19, 15, 38, 0.85); z-index: 1000; }
        .logo { font-size: 20px; font-weight: 900; background: linear-gradient(45deg, #00ff66, #00e5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .wallet-box { background: rgba(0, 255, 102, 0.12); color: var(--accent-green); padding: 6px 14px; border-radius: 20px; font-weight: 700; }
        .app-container { padding: 20px; max-width: 480px; margin: 0 auto; }
        .section { display: none; } .section.active { display: block; }
        .premium-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 22px; padding: 20px; margin-bottom: 20px; text-align: center; }
        .app-btn { background: linear-gradient(135deg, #9d4edd 0%, #6a0dad 100%); color: white; border: none; padding: 12px 18px; width: 100%; border-radius: 14px; cursor: pointer; margin-top: 10px; font-weight: 600; }
        
        #wheel { width: 150px; height: 150px; border-radius: 50%; border: 8px solid #333; margin: 15px auto; display: flex; align-items: center; justify-content: center; background: conic-gradient(red 0deg 72deg, green 72deg 144deg, yellow 144deg 216deg, blue 216deg 288deg, purple 288deg 360deg); }
        .spinning { animation: rotateWheel 4s cubic-bezier(0.17, 0.67, 0.12, 0.99) forwards; }
        @keyframes rotateWheel { from { transform: rotate(0deg); } to { transform: rotate(1800deg); } }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(9, 7, 15, 0.92); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--card-border); z-index: 1000; }
        .nav-item { color: #94a3b8; cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--accent-green); }
    </style>
</head>
<body>

    <header>
        <div class="logo">AdsDekho PaiseKamao</div>
        <div class="wallet-box">🪙 ₹<span id="balance">0.00</span></div>
    </header>

    <div class="app-container">
        <div id="home" class="section active">
            <button class="app-btn" onclick="claimTelegramBonus()" style="background: #0088cc;">Join channel & claim 4 ₹</button>
            <div class="premium-card">
                <h3>Lucky Spin Wheel 🎡</h3>
                <div id="wheel">SPIN</div>
                <button class="app-btn" style="background:var(--accent-green); color:#000;" onclick="startSpin()">SPIN NOW</button>
            </div>
            <div class="premium-card"><h3>GK Quiz 🧠</h3><button class="app-btn" onclick="alert('GK Quiz Starting!')">Play Now</button></div>
            <div class="premium-card"><h3>Math Quiz ➗</h3><button class="app-btn" onclick="alert('Math Quiz Starting!')">Play Now</button></div>
        </div>

        <div id="view-ads" class="section">
            <div class="premium-card">
                <h2>Watch Ads</h2>
                <button class="app-btn" onclick="openInAdEngine()">Watch Video Ad (+ ₹0.50)</button>
            </div>
        </div>

        <div id="redeem" class="section">
            <div class="premium-card">
                <h2>Redeem Gift Card</h2>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; margin-bottom:10px;">
                    <div style="background:#222; padding:5px; border-radius:5px;" onclick="selectGift('Amazon')">Amazon</div>
                    <div style="background:#222; padding:5px; border-radius:5px;" onclick="selectGift('PlayStore')">PlayStore</div>
                    <div style="background:#222; padding:5px; border-radius:5px;" onclick="selectGift('Flipkart')">Flipkart</div>
                </div>
                <form id="payout-form" onsubmit="handleFirebaseRedeem(event)">
                    <input type="email" id="user-email" placeholder="Email" required style="width:100%; padding:10px; margin-bottom:10px;">
                    <input type="number" id="payout-amount" placeholder="Amount" min="10" required style="width:100%; padding:10px;">
                    <button type="submit" class="app-btn">Confirm Redemption</button>
                </form>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchToTab('home', this)">🏠<br>Home</div>
        <div class="nav-item" onclick="switchToTab('view-ads', this)">📺<br>Ads</div>
        <div class="nav-item" onclick="switchToTab('redeem', this)">🎁<br>Redeem</div>
    </nav>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA7CCx2yrZK3HfGTlawBI8RiP70bMm55Z4", authDomain: "adsdekho-pese-kamao.firebaseapp.com", projectId: "adsdekho-pese-kamao", storageBucket: "adsdekho-pese-kamao.firebasestorage.app", messagingSenderId: "1041347482830", appId: "1:1041347482830:web:4cb835e22749aaeeb46c9f" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let selectedGift = "";
        let walletBalance = parseFloat(localStorage.getItem('adsdekho_pk_bal')) || 0.00;
        document.getElementById('balance').innerText = walletBalance.toFixed(2);

        function switchToTab(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        function selectGift(g) { selectedGift = g; alert("Selected: " + g); }

        function startSpin() {
            const wheel = document.getElementById('wheel');
            wheel.classList.remove('spinning');
            void wheel.offsetWidth;
            wheel.classList.add('spinning');
            setTimeout(() => {
                const prizes = [1, 2, 0.50, 8, -5];
                const prize = prizes[Math.floor(Math.random() * prizes.length)];
                walletBalance += prize;
                localStorage.setItem('adsdekho_pk_bal', walletBalance);
                document.getElementById('balance').innerText = walletBalance.toFixed(2);
                alert("Spin Result: ₹" + prize);
            }, 4000);
        }

        function claimTelegramBonus() {
            if(localStorage.getItem('telegram_bonus_claimed')) { alert("Already claimed!"); return; }
            walletBalance += 4.00;
            localStorage.setItem('adsdekho_pk_bal', walletBalance);
            localStorage.setItem('telegram_bonus_claimed', 'true');
            document.getElementById('balance').innerText = walletBalance.toFixed(2);
            window.open("https://t.me/adsdekho", "_blank");
        }
        
        function handleFirebaseRedeem(e) {
            e.preventDefault();
            db.collection("redemption_requests").add({ email: document.getElementById('user-email').value, amount: document.getElementById('payout-amount').value, gift: selectedGift }).then(() => alert("Request sent!"));
        }
    </script>
</body>
</html>
