<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AdsDekho PaiseKamao - Real Cash Rewards</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #09070f 0%, #130f26 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.09);
            --accent-green: #00ff66;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }
        header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); position: sticky; top: 0; background: rgba(19, 15, 38, 0.85); z-index: 1000; }
        .logo { font-size: 20px; font-weight: 900; background: linear-gradient(45deg, #00ff66, #00e5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .wallet-box { background: rgba(0, 255, 102, 0.12); color: var(--accent-green); padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 14px; }
        .app-container { padding: 20px; max-width: 480px; margin: 0 auto; }
        .section { display: none; } .section.active { display: block; }
        .premium-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 22px; padding: 20px; margin-bottom: 20px; }
        .app-btn { background: linear-gradient(135deg, #9d4edd 0%, #6a0dad 100%); color: white; border: none; padding: 14px 20px; width: 100%; border-radius: 14px; cursor: pointer; margin-top: 15px; font-weight: 600; }
        .app-btn.telegram-btn { background: linear-gradient(135deg, #0088cc 0%, #006699 100%); }
        .form-group input { width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--card-border); border-radius: 12px; color: white; margin-top: 5px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(9, 7, 15, 0.92); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--card-border); z-index: 1000; }
        .nav-item { color: var(--text-muted); cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--accent-green); }
        .coming-soon-card { opacity: 0.6; border-left: 4px solid var(--text-muted); }
        .premium-badge { background: rgba(255, 255, 255, 0.08); padding: 4px 10px; border-radius: 20px; font-size: 11px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">AdsDekho <span>PaiseKamao</span></div>
        <div class="wallet-box">🪙 ₹<span id="balance">0.00</span></div>
    </header>

    <div class="app-container">
        <div id="home" class="section active">
            <a href="https://t.me/adsdekho" target="_blank" style="text-decoration:none;">
                <button class="app-btn telegram-btn">Join channel nd claim 4 ₹</button>
            </a>
            <div class="premium-card"><h2>Welcome Back! 👋</h2><p>Tasks poore kijiye.</p></div>
            <div class="premium-card coming-soon-card"><h3>Lucky Spin Wheel 🎡</h3><span class="premium-badge">Coming Soon</span></div>
            <div class="premium-card coming-soon-card"><h3>GK Quiz 🧠</h3><span class="premium-badge">Coming Soon</span></div>
            <div class="premium-card coming-soon-card"><h3>Math Quiz ➗</h3><span class="premium-badge">Coming Soon</span></div>
        </div>

        <div id="redeem" class="section">
            <div class="premium-card">
                <h2>Redeem Request</h2>
                <form id="payout-form" onsubmit="handleFirebaseRedeem(event)">
                    <div class="form-group"><label>Email ID</label><input type="email" id="user-email" required></div>
                    <div class="form-group"><label>Amount</label><input type="number" id="payout-amount" min="10" required></div>
                    <button type="submit" class="app-btn">Confirm Redemption</button>
                </form>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchToTab('home', this)">🏠<span>Home</span></div>
        <div class="nav-item" onclick="switchToTab('redeem', this)">🎁<span>Redeem</span></div>
    </nav>

    <script>
        // FIREBASE INITIALIZATION
        const firebaseConfig = {
            apiKey: "AIzaSyA7CCx2yrZK3HfGTlawBI8RiP70bMm55Z4",
            authDomain: "adsdekho-pese-kamao.firebaseapp.com",
            projectId: "adsdekho-pese-kamao",
            storageBucket: "adsdekho-pese-kamao.firebasestorage.app",
            messagingSenderId: "1041347482830",
            appId: "1:1041347482830:web:4cb835e22749aaeeb46c9f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let walletBalance = parseFloat(localStorage.getItem('adsdekho_pk_bal')) || 0.00;
        document.getElementById('balance').innerText = walletBalance.toFixed(2);

        function switchToTab(target, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(target).classList.add('active');
            el.classList.add('active');
        }

        function handleFirebaseRedeem(event) {
            event.preventDefault();
            const email = document.getElementById('user-email').value;
            const amount = parseFloat(document.getElementById('payout-amount').value);

            if (walletBalance < amount) { alert("Insufficient Balance!"); return; }

            db.collection("redemption_requests").add({
                email: email,
                amount: amount,
                status: "Pending",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("Request sent successfully! Admin will review.");
                walletBalance -= amount;
                localStorage.setItem('adsdekho_pk_bal', walletBalance);
                document.getElementById('balance').innerText = walletBalance.toFixed(2);
                document.getElementById('payout-form').reset();
            })
            .catch(err => alert("Error: " + err.message));
        }
    </script>
</body>
</html>
