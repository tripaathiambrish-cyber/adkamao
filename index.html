<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>My Website</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
    
    .watch-ad-btn {
      padding: 18px 40px;
      font-size: 20px;
      background: #e60000;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(230,0,0,0.4);
      margin: 30px;
    }
    
    .watch-ad-btn:hover {
      background: #ff1a1a;
      transform: scale(1.05);
    }

    .ad-container {
      display: none;        /* Important: Pehle hide */
      margin: 40px auto;
      max-width: 800px;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Website</h1>
  <p>Aapka content yahan rahega...</p>

  <!-- Watch Ad Button -->
  <button class="watch-ad-btn" onclick="openAd()">
    ▶️ Watch Ad to Continue
  </button>

  <!-- Ad Area (sirf click pe dikhega) -->
  <div class="ad-container" id="adContainer">
    <h3>Ad Loading...</h3>
    <div id="adSlot"></div>
  </div>

<script>
// Sirf button click pe ad khulega
function openAd() {
  document.getElementById('adContainer').style.display = 'block';

  // Example 2: Simple Pop-under / New Tab Ad

}
</script>

</body>
</html>
