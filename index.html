<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AdsDekho PaiseKamao - Real Cash Rewards</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA7CCx2yrZK3HfGTlawBI8RiP70bMm55Z4",
          authDomain: "adsdekho-pese-kamao.firebaseapp.com",
          projectId: "adsdekho-pese-kamao",
          storageBucket: "adsdekho-pese-kamao.firebasestorage.app",
          messagingSenderId: "1041347482830",
          appId: "1:1041347482830:web:4cb835e22749aaeeb46c9f",
          measurementId: "G-78H1943NKH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        getAnalytics(app);

        window.registerUser = async () => {
            const email = document.getElementById("user-email").value;
            if(!email) { alert("Please enter email"); return; }
            await addDoc(collection(db, "users"), { email: email, status: "pending", timestamp: new Date() });
            alert("Registration successful! Wait for approval.");
        };
    </script>

    <style>
        /* (Yahan tumhara original CSS hai) */
        :root { --bg-gradient: linear-gradient(135deg, #09070f 0%, #130f26 100%); --card-bg: rgba(255, 255, 255, 0.05); --card-border: rgba(255, 255, 255, 0.09); --accent-green: #00ff66; --text-main: #ffffff; --text-muted: #94a3b8; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }
        .app-container { padding: 20px; max-width: 480px; margin: 0 auto; }
        .section { display: none; } .section.active { display: block; }
        .premium-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 22px; padding: 20px; margin-bottom: 20px; }
        .app-btn { background: linear-gradient(135deg, #9d4edd 0%, #6a0dad 100%); color: white; border: none; padding: 14px; width: 100%; border-radius: 14px; cursor: pointer; margin-top: 10px; }
        .telegram-btn { background: #229ed9; color: white; padding: 14px; border-radius: 14px; text-align: center; font-weight: bold; margin-bottom: 20px; display: block; text-decoration: none; }
        .giftcard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .giftcard-option { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px 6px; text-align: center; cursor: pointer; }
        .giftcard-option.active { border-color: var(--accent-green); background: rgba(0, 255, 102, 0.12); }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; left: 0; background: rgba(9, 7, 15, 0.92); display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid var(--card-border); }
        .nav-item { color: var(--text-muted); cursor: pointer; text-align: center; font-size: 12px; }
        .nav-item.active { color: var(--accent-green); }
        #inapp-ad-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="home" class="section active">
            <a href="https://t.me/adsdekho" class="telegram-btn">Join Telegram Channel 🚀</a>
            <div class="premium-card">
                <h3>Register</h3>
                <input type="email" id="user-email" placeholder="Email" style="width:100%; padding:10px; border-radius:10px;">
                <button class="app-btn" onclick="registerUser()">Register</button>
            </div>
            <div class="premium-card"><h2>Welcome Back!</h2></div>
        </div>

        <div id="view-ads" class="section">
            <div class="premium-card">
                <h2>Watch Premium Ads</h2>
                <button class="app-btn" onclick="openInAppAdEngine()">Watch Video Ad</button>
            </div>
        </div>

        <div id="redeem" class="section">
            <div class="premium-card">
                <h2>Redeem Gift Card</h2>
                <div class="giftcard-grid">
                    <div class="giftcard-option" onclick="alert('Amazon Selected')">📦 Amazon</div>
                    <div class="giftcard-option" onclick="alert('PlayStore Selected')">🎯 PlayStore</div>
                    <div class="giftcard-option" onclick="alert('Flipkart Selected')">⚡ Flipkart</div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="showSection('home', this)">🏠 Home</div>
        <div class="nav-item" onclick="showSection('view-ads', this)">📺 Ads</div>
        <div class="nav-item" onclick="showSection('redeem', this)">🎁 Redeem</div>
    </nav>

    <div id="inapp-ad-modal"><iframe id="ad-target-frame" style="width:100%; height:100%;"></iframe></div>

    <script>
        function showSection(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            btn.classList.add('active');
        }
        function openInAppAdEngine() {
            document.getElementById('inapp-ad-modal').style.display = 'block';
            document.getElementById('ad-target-frame').src = "https://www.effectivecpmnetwork.com/m2ds8022zn?key=b7ed26fc3794ac80821ca064a92d5e76";
        }
    </script>
</body>
</html>
