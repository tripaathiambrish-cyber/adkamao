<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdsDekho Pese Kamao</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { background: #0f0f0f; color: #fff; font-family: sans-serif; margin: 0; }
        .tab-content { display: none; padding: 20px; }
        .active { display: block; }
        .btn { background: #00ff66; padding: 15px; width: 100%; border: none; border-radius: 10px; margin-top: 10px; font-weight: bold; }
        .nav { display: flex; justify-content: space-around; background: #1a1a1a; padding: 15px; position: fixed; bottom: 0; width: 100%; }
        .card { background: #222; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="home" class="tab-content active">
        <h2>Dashboard</h2>
        <div class="card"><h3>Balance: ₹<span id="balance">0</span></h3></div>
        <p>Welcome, start earning by watching ads!</p>
    </div>

    <div id="ads" class="tab-content">
        <h2>Watch Ads</h2>
        <div class="card" onclick="watchAd()">
            <p>Click to Watch Ad & Earn ₹2</p>
            <button class="btn">WATCH AD</button>
        </div>
    </div>

    <div id="redeem" class="tab-content">
        <h2>Redeem Rewards</h2>
        <select id="giftType" style="width:100%; padding:10px; margin-bottom:10px;">
            <option>Amazon Gift Card</option>
            <option>Play Store Redeem Code</option>
            <option>Flipkart Gift Card</option>
        </select>
        <input type="email" id="email" placeholder="Email" style="width:90%; padding:10px; margin-bottom:10px;">
        <button class="btn" style="background:#ff9900;" onclick="submitRedeem()">Submit Request</button>
    </div>

    <div class="nav">
        <button onclick="showTab('home')">Home</button>
        <button onclick="showTab('ads')">Ads</button>
        <button onclick="showTab('redeem')">Redeem</button>
    </div>

    <script>
        const firebaseConfig = { /* Yahan apni wahi purani keys daalna */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let bal = parseFloat(localStorage.getItem('bal')) || 0;
        document.getElementById('balance').innerText = bal;

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function watchAd() {
            bal += 2;
            localStorage.setItem('bal', bal);
            document.getElementById('balance').innerText = bal;
            alert("Ad watched! ₹2 added.");
        }

        function submitRedeem() {
            db.collection("redemption_requests").add({
                email: document.getElementById('email').value,
                gift: document.getElementById('giftType').value,
                amount: bal,
                status: "Pending"
            }).then(() => alert("Request sent successfully!"));
        }
    </script>
</body>
</html>
